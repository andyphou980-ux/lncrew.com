<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LN CREW — GARAGE</title>
  <meta name="description" content="Late Night Crew garage. Fix it. Mod it. Send it." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#050505; --red:#c8102e; --hot:#ff1a3c; --cream:#f3eee6; --muted:#8a8480; --steel:#2a2d32; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      width:100%; height:100%; background:var(--bg); color:var(--cream);
      font-family:"Oswald", system-ui, sans-serif; overflow:hidden;
      touch-action:manipulation; user-select:none; -webkit-user-select:none;
    }
    #wrap {
      width:100%; height:100%; display:flex; align-items:center; justify-content:center;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(200,16,46,.16), transparent 46%),
        radial-gradient(ellipse at 90% 100%, rgba(40,40,20,.2), transparent 40%),
        #050505;
    }
    header.brand {
      position:absolute; top:10px; left:0; right:0; z-index:6;
      display:flex; justify-content:space-between; align-items:center; padding:0 16px;
      pointer-events:none;
    }
    header.brand .mark { font-family:"Bebas Neue", sans-serif; letter-spacing:.08em; font-size:22px; }
    header.brand .mark span { color:var(--red); }
    header.brand .loc { font-size:11px; letter-spacing:.28em; color:var(--red); }
    #stage {
      position:relative; width:min(420px,100vw); height:min(780px,100dvh);
      background:#090909; box-shadow:0 0 0 1px #1c1c1c, 0 30px 80px rgba(0,0,0,.7);
      overflow:hidden;
    }
    canvas { display:block; width:100%; height:100%; }
    #hud { position:absolute; inset:0; z-index:3; pointer-events:none; }
    #hud.hidden { display:none; }
    #hud .top {
      display:flex; justify-content:space-between; padding:14px 12px 0;
      font-family:"Share Tech Mono", monospace; font-size:12px; letter-spacing:.05em;
    }
    #hud .muted { color:var(--muted); }
    #job {
      position:absolute; left:10px; right:10px; top:46px;
      background:rgba(8,8,8,.78); border:1px solid #2a1216; padding:8px 10px;
      pointer-events:none;
    }
    #job h3 { font-family:"Bebas Neue", sans-serif; font-size:20px; letter-spacing:.06em; color:var(--cream); }
    #job h3 b { color:var(--red); }
    #job p { font-size:12px; color:var(--muted); margin-top:2px; }
    #timerbar { height:4px; background:#1a1a1a; margin-top:8px; }
    #timerbar > i { display:block; height:100%; width:100%; background:var(--red); }
    #bench {
      position:absolute; left:0; right:0; bottom:0; z-index:4;
      padding:8px 8px 12px; background:linear-gradient(180deg, transparent, #070707 18%);
      pointer-events:auto;
    }
    #parts {
      display:grid; grid-template-columns:repeat(4,1fr); gap:7px;
    }
    .part {
      border:1px solid #2a2a2a; background:#121212; color:var(--cream);
      font-family:"Oswald", sans-serif; font-size:11px; letter-spacing:.04em;
      padding:10px 4px 8px; text-align:center; cursor:pointer;
      min-height:58px;
    }
    .part.on { border-color:var(--red); background:#2a0c12; color:#fff; }
    .part .ico { font-size:16px; display:block; margin-bottom:3px; color:var(--red); }
    #toast {
      position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
      font-family:"Bebas Neue", sans-serif; font-size:34px; letter-spacing:.08em;
      color:#fff; text-shadow:0 4px 18px #000; pointer-events:none; opacity:0;
      z-index:5;
    }
    #overlay {
      position:absolute; inset:0; z-index:7;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.9));
      text-align:center; padding:22px 18px;
    }
    #overlay.hidden { display:none; }
    #overlay .sub { letter-spacing:.32em; font-size:11px; color:var(--red); text-transform:uppercase; }
    #overlay h1 {
      font-family:"Bebas Neue", sans-serif; font-size:clamp(48px,15vw,78px);
      line-height:.82; letter-spacing:.02em; margin-top:8px;
    }
    #overlay h1 .w { display:block; color:var(--cream); }
    #overlay h1 .r { display:block; color:var(--red); }
    #overlay .tag { margin-top:16px; color:var(--muted); max-width:300px; font-size:14px; line-height:1.4; }
    #overlay .stats { margin-top:16px; font-family:"Share Tech Mono", monospace; font-size:13px; }
    #overlay .stats b { color:var(--red); }
    button.cta {
      margin-top:22px; border:0; background:var(--red); color:#fff;
      font-family:"Bebas Neue", sans-serif; font-size:26px; letter-spacing:.12em;
      padding:10px 26px 8px; cursor:pointer; transform:skewX(-8deg);
    }
    button.cta span { display:inline-block; transform:skewX(8deg); }
    #overlay .how { margin-top:14px; font-size:12px; color:#6b6662; }
    #tune {
      position:absolute; left:12px; right:12px; bottom:96px; z-index:5;
      background:rgba(8,8,8,.92); border:1px solid #3a1518; padding:12px;
      display:none; pointer-events:auto;
    }
    #tune.show { display:block; }
    #tune .lbl { font-size:12px; letter-spacing:.16em; color:var(--red); }
    #tune .track { position:relative; height:28px; background:#161616; margin:10px 0 12px; overflow:hidden; }
    #tune .sweet { position:absolute; top:0; bottom:0; background:rgba(200,16,46,.35); border-left:2px solid var(--red); border-right:2px solid var(--red); }
    #tune .needle { position:absolute; top:0; bottom:0; width:3px; background:#f3eee6; }
    footer.credit {
      position:absolute; bottom:6px; left:0; right:0; text-align:center;
      font-size:10px; letter-spacing:.2em; color:#3a3a3a; z-index:8; pointer-events:none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header class="brand">
      <div class="mark">LN <span>CREW</span></div>
      <div class="loc">HTX // LAX</div>
    </header>
    <div id="stage">
      <canvas id="game" width="420" height="780"></canvas>
      <div id="hud" class="hidden">
        <div class="top">
          <div>CASH $<span id="cash">0</span></div>
          <div class="muted">JOB <span id="jobn">1</span>/6</div>
          <div class="muted">BEST $<span id="best">0</span></div>
        </div>
        <div id="job">
          <h3 id="carName">S14</h3>
          <p id="jobTxt">—</p>
          <div id="timerbar"><i id="tfill"></i></div>
        </div>
      </div>
      <div id="toast"></div>
      <div id="tune">
        <div class="lbl" id="tuneLbl">BOOST TUNE</div>
        <div class="track">
          <div class="sweet" id="sweet"></div>
          <div class="needle" id="needle"></div>
        </div>
        <button class="cta" id="tuneHit" style="width:100%; transform:none; margin-top:0;"><span>LOCK IT</span></button>
      </div>
      <div id="bench" class="hidden">
        <div id="parts"></div>
      </div>
      <div id="overlay">
        <div class="sub">Late Night Bay</div>
        <h1><span class="w">FIX IT</span><span class="w">MOD IT</span><span class="r">SEND IT</span></h1>
        <p class="tag">Cars pull up cooked. You bolt the right parts, hit the tune, don’t send junk.</p>
        <div class="stats" id="menuStats"></div>
        <button class="cta" id="startBtn"><span>OPEN THE BAY</span></button>
        <div class="how">tap a part · tap the zone on the car<br/>then lock the tune</div>
      </div>
    </div>
    <footer class="credit">LNCrew.com · IYKYK</footer>
  </div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = 420, H = 780;

  const overlay = document.getElementById("overlay");
  const hud = document.getElementById("hud");
  const bench = document.getElementById("bench");
  const partsEl = document.getElementById("parts");
  const toast = document.getElementById("toast");
  const tuneBox = document.getElementById("tune");
  const sweet = document.getElementById("sweet");
  const needle = document.getElementById("needle");
  const tuneLbl = document.getElementById("tuneLbl");
  const startBtn = document.getElementById("startBtn");
  const menuStats = document.getElementById("menuStats");

  const BEST_KEY = "lncrew_garage_best";
  let best = Number(localStorage.getItem(BEST_KEY) || 0);

  const CATALOG = [
    { id:"turbo", name:"T3 TURBO", ico:"◉", slot:"engine" },
    { id:"manifold", name:"ELBOW", ico:"∟", slot:"engine" },
    { id:"coils", name:"COILOVERS", ico:"∥", slot:"susp" },
    { id:"arms", name:"LCA ARMS", ico:"⋀", slot:"susp" },
    { id:"wheels", name:"TE37s", ico:"⊕", slot:"wheels" },
    { id:"tires", name:"NT05s", ico:"○", slot:"wheels" },
    { id:"pads", name:"PADS", ico:"▣", slot:"brakes" },
    { id:"lines", name:"SS LINES", ico:"≈", slot:"brakes" },
    { id:"lip", name:"FRONT LIP", ico:"▾", slot:"body" },
    { id:"wing", name:"TRUNK WING", ico:"▬", slot:"body" },
    { id:"ecu", name:"PIGGYBACK", ico:"▦", slot:"tune" },
    { id:"waste", name:"WASTEGATE", ico:"◎", slot:"engine" },
    { id:"intake", name:"SHORT RAM", ico:"S", slot:"engine" },
    { id:"camber", name:"CAMBER KIT", ico:"∠", slot:"susp" },
    { id:"rotors", name:"SLotted", ico:"⊗", slot:"brakes" },
    { id:"wrap", name:"LN WRAP", ico:"LN", slot:"body" }
  ];

  const BUILDS = [
    { name:"S14 KOUKI", kind:"s14", color:["#c8102e","#5a0a14"], jobs:[["engine","boost leak — turbo’s cooked"],["brakes","pads glazed"],["susp","needs drop"]] },
    { name:"R32 GT-R", kind:"r32", color:["#d6d0c6","#6a6660"], jobs:[["engine","stock snail gotta go"],["wheels","curbed factory steels"],["body","needs the wing"]] },
    { name:"FD RX-7", kind:"fd", color:["#1a1c20","#0a0a0a"], jobs:[["engine","apex seals begging"],["tune","map’s a mess"],["susp","sits too tall"]] },
    { name:"Z32 TT", kind:"z32", color:["#2c4a6e","#142232"], jobs:[["brakes","cooked rotors"],["wheels","need real shoes"],["body","lip smashed"]] },
    { name:"EG HATCH", kind:"eg", color:["#e8e2d6","#8a8480"], jobs:[["susp","bagged wrong"],["engine","needs pull"],["body","LN wrap that lid"]] },
    { name:"180SX", kind:"180", color:["#3a2a12","#1a1208"], jobs:[["tune","running pig rich"],["brakes","lines swelling"],["wheels","TE37s or stay home"]] }
  ];

  const SLOTS = {
    engine: { x: 210, y: 268, r: 36, label:"ENGINE" },
    susp:   { x: 118, y: 390, r: 32, label:"SUSP" },
    brakes: { x: 302, y: 390, r: 32, label:"BRAKES" },
    wheels: { x: 118, y: 470, r: 32, label:"WHEELS" },
    body:   { x: 302, y: 470, r: 32, label:"BODY" },
    tune:   { x: 210, y: 348, r: 30, label:"ECU" }
  };

  const S = {
    screen: "menu",
    t: 0, cash: 0, jobI: 0, time: 1, timeMax: 1,
    car: null, needed: [], done: {},
    selected: null, flash: "", flashT: 0,
    tune: null, shift: 6
  };

  function pad(n) { return String(Math.floor(n)); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

  function showToast(txt, ms) {
    toast.textContent = txt;
    toast.style.opacity = "1";
    clearTimeout(showToast._id);
    showToast._id = setTimeout(() => toast.style.opacity = "0", ms || 700);
  }

  function partsForJob(needed) {
    const must = needed.map(n => {
      const pool = CATALOG.filter(p => p.slot === n.slot);
      return pick(pool);
    });
    const decoy = [];
    while (decoy.length < 4) {
      const p = pick(CATALOG);
      if (!must.find(m => m.id === p.id) && !decoy.find(d => d.id === p.id)) decoy.push(p);
    }
    return must.concat(decoy).sort(() => Math.random() - 0.5);
  }

  function nextJob() {
    if (S.jobI >= S.shift) { endShift(); return; }
    const build = BUILDS[S.jobI % BUILDS.length];
    const nJobs = 3 + (S.jobI > 2 ? 1 : 0);
    const jobs = build.jobs.slice(0, Math.min(nJobs, build.jobs.length));
    S.car = { ...build, x: W + 80, inX: 210 };
    S.needed = jobs.map(j => ({ slot: j[0], txt: j[1], done: false }));
    S.done = {};
    S.selected = null;
    S.timeMax = 22 - Math.min(8, S.jobI * 1.2);
    S.time = S.timeMax;
    S.tune = null;
    tuneBox.classList.remove("show");
    document.getElementById("carName").innerHTML = build.name + " <b>BAY " + (S.jobI+1) + "</b>";
    document.getElementById("jobTxt").textContent = jobs.map(j => j[1]).join(" · ");
    document.getElementById("jobn").textContent = String(S.jobI + 1);
    renderParts(partsForJob(S.needed));
    bench.classList.remove("hidden");
  }

  function renderParts(list) {
    partsEl.innerHTML = "";
    list.forEach(p => {
      const b = document.createElement("button");
      b.className = "part";
      b.dataset.id = p.id;
      b.innerHTML = '<span class="ico">' + p.ico + "</span>" + p.name;
      b.onclick = () => {
        if (S.screen !== "play" || S.tune) return;
        S.selected = p;
        [...partsEl.children].forEach(el => el.classList.toggle("on", el.dataset.id === p.id));
      };
      partsEl.appendChild(b);
    });
  }

  function startShift() {
    S.screen = "play";
    S.t = 0; S.cash = 0; S.jobI = 0;
    overlay.classList.add("hidden");
    hud.classList.remove("hidden");
    nextJob();
  }

  function payday(mult) {
    const base = 180 + S.jobI * 40;
    const tip = Math.floor(base * (S.time / S.timeMax) * mult);
    S.cash += tip;
    document.getElementById("cash").textContent = pad(S.cash);
    showToast("+$" + tip, 800);
    S.jobI++;
    setTimeout(nextJob, 700);
  }

  function failJob(why) {
    showToast(why, 900);
    S.jobI++;
    setTimeout(nextJob, 800);
  }

  function endShift() {
    S.screen = "done";
    if (S.cash > best) {
      best = S.cash;
      localStorage.setItem(BEST_KEY, String(best));
    }
    bench.classList.add("hidden");
    hud.classList.add("hidden");
    tuneBox.classList.remove("show");
    overlay.classList.remove("hidden");
    overlay.querySelector(".sub").textContent = "Bay closed";
    overlay.querySelector("h1").innerHTML = '<span class="w">SHIFT</span><span class="w">DONE</span><span class="r">$' + S.cash + "</span>";
    overlay.querySelector(".tag").textContent = S.cash >= 900
      ? "Pack’s rolling cleaner. You actually wrench."
      : "Some cars left half-done. Crew clocks that.";
    menuStats.innerHTML = "BEST <b>$" + best + "</b>";
    startBtn.querySelector("span").textContent = "OPEN THE BAY";
  }

  function openTune() {
    const kinds = [
      { name:"BOOST TUNE", sweet: 0.62, w: 0.14 },
      { name:"ALIGNMENT", sweet: 0.48, w: 0.12 },
      { name:"AFR LOCK", sweet: 0.55, w: 0.11 }
    ];
    S.tune = { ...pick(kinds), pos: 0, dir: 1, speed: 0.018 + S.jobI * 0.003 };
    tuneLbl.textContent = S.tune.name;
    sweet.style.left = (S.tune.sweet * 100) + "%";
    sweet.style.width = (S.tune.w * 100) + "%";
    sweet.style.transform = "translateX(-50%)";
    tuneBox.classList.add("show");
  }

  document.getElementById("tuneHit").onclick = () => {
    if (!S.tune) return;
    const hit = Math.abs(S.tune.pos - S.tune.sweet) <= S.tune.w / 2;
    tuneBox.classList.remove("show");
    S.tune = null;
    if (hit) payday(1.35);
    else payday(0.7);
  };

  startBtn.onclick = startShift;

  canvas.addEventListener("pointerdown", e => {
    if (S.screen !== "play" || S.tune || !S.selected) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    for (const need of S.needed) {
      if (need.done) continue;
      const sl = SLOTS[need.slot];
      const dx = x - sl.x, dy = y - sl.y;
      if (dx * dx + dy * dy <= (sl.r + 10) * (sl.r + 10)) {
        if (S.selected.slot === need.slot) {
          need.done = true;
          S.done[need.slot] = S.selected.id;
          showToast(S.selected.name + " ON", 500);
          S.selected = null;
          [...partsEl.children].forEach(el => el.classList.remove("on"));
          if (S.needed.every(n => n.done)) openTune();
        } else {
          S.time -= 3;
          showToast("WRONG PART", 500);
        }
        return;
      }
    }
  });

  function lnLogo(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = "#c8102e";
    ctx.beginPath();
    ctx.moveTo(-16,-10); ctx.lineTo(16,-10); ctx.lineTo(13,12); ctx.lineTo(-13,12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f3eee6";
    ctx.font = "700 14px Bebas Neue, Impact, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("LN", 0, 1);
    ctx.restore();
  }

  function drawBay() {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#0c0d10"); g.addColorStop(1, "#151515");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // brick
    ctx.fillStyle = "#1a1210";
    ctx.fillRect(0, 120, W, 16);
    ctx.fillStyle = "#241816";
    for (let y = 136; y < 210; y += 14) {
      ctx.fillRect(0, y, W, 12);
    }
    // lights
    ctx.fillStyle = "rgba(255,210,140,.08)";
    ctx.fillRect(40, 210, 140, 280);
    ctx.fillRect(240, 210, 140, 280);
    ctx.fillStyle = "#e8b56a";
    ctx.fillRect(70, 198, 80, 6);
    ctx.fillRect(270, 198, 80, 6);
    // floor
    ctx.fillStyle = "#0e0e0e";
    ctx.fillRect(0, 520, W, H);
    ctx.strokeStyle = "rgba(200,16,46,.35)";
    ctx.lineWidth = 3;
    ctx.strokeRect(48, 540, W - 96, 70);
    ctx.fillStyle = "rgba(200,16,46,.08)";
    ctx.fillRect(48, 540, W - 96, 70);
    lnLogo(36, 88, 1.15);
    ctx.fillStyle = "#8a8480";
    ctx.font = "11px Oswald";
    ctx.textAlign = "left";
    ctx.fillText("BAY 01  ·  LATE NIGHT", 58, 92);
  }

  function bodyPath(kind, w, h) {
    const hw = w/2, hh = h/2;
    ctx.beginPath();
    if (kind === "eg") {
      ctx.moveTo(-hw+6, hh-6); ctx.lineTo(-hw, hh-24); ctx.lineTo(-hw+4, -hh+30);
      ctx.lineTo(-hw+16, -hh+8); ctx.lineTo(hw-16, -hh+8); ctx.lineTo(hw-4, -hh+30);
      ctx.lineTo(hw, hh-24); ctx.lineTo(hw-6, hh-6);
    } else if (kind === "fd") {
      ctx.moveTo(-hw+8, hh-4); ctx.lineTo(-hw, hh-28); ctx.lineTo(-hw+8, -hh+36);
      ctx.lineTo(-hw+14, -hh+6); ctx.lineTo(hw-14, -hh+6); ctx.lineTo(hw-8, -hh+36);
      ctx.lineTo(hw, hh-28); ctx.lineTo(hw-8, hh-4);
    } else if (kind === "r32") {
      ctx.moveTo(-hw+6, hh-6); ctx.lineTo(-hw, hh-22); ctx.lineTo(-hw+2, -hh+24);
      ctx.lineTo(-hw+14, -hh+8); ctx.lineTo(hw-14, -hh+8); ctx.lineTo(hw-2, -hh+24);
      ctx.lineTo(hw, hh-22); ctx.lineTo(hw-6, hh-6);
    } else {
      ctx.moveTo(-hw+8, hh-5); ctx.lineTo(-hw, hh-26); ctx.lineTo(-hw+6, -hh+32);
      ctx.lineTo(-hw+16, -hh+7); ctx.lineTo(hw-16, -hh+7); ctx.lineTo(hw-6, -hh+32);
      ctx.lineTo(hw, hh-26); ctx.lineTo(hw-8, hh-5);
    }
    ctx.closePath();
  }

  function drawCar(car, x, y) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI/2);
    const w = 78, h = 168;
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.beginPath(); ctx.ellipse(0, 10, 40, 78, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = car.color[0];
    bodyPath(car.kind, w, h); ctx.fill();
    ctx.fillStyle = car.color[1];
    ctx.fillRect(-w/2+8, -20, w-16, 18);
    ctx.fillStyle = "#151c24";
    ctx.fillRect(-w/2+14, -h/2+18, w-28, 28);
    ctx.fillStyle = "rgba(180,210,230,.15)";
    ctx.fillRect(-w/2+14, -h/2+18, w-28, 8);
    ctx.fillStyle = "#0b0b0b";
    ctx.fillRect(-w/2-6, -h/2+40, 8, 28);
    ctx.fillRect(w/2-2, -h/2+40, 8, 28);
    ctx.fillRect(-w/2-6, h/2-68, 8, 28);
    ctx.fillRect(w/2-2, h/2-68, 8, 28);
    ctx.fillStyle = "#ffe7a0";
    ctx.fillRect(-12, -h/2+4, 24, 6);
    ctx.fillStyle = "#c8102e";
    ctx.fillRect(-16, h/2-10, 32, 6);
    if (S.done.body === "wing" || S.done.body === "lip" || S.done.body) {
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(-22, h/2-18, 44, 5);
    }
    if (S.done.wheels) {
      ctx.strokeStyle = "#c8102e"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-w/2-2, -h/2+54, 10, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(w/2+2, -h/2+54, 10, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
    lnLogo(x + 70, y - 90, 0.85);
  }

  function drawSlots() {
    if (!S.car || S.screen !== "play") return;
    for (const need of S.needed) {
      const sl = SLOTS[need.slot];
      const ok = need.done;
      ctx.beginPath();
      ctx.arc(sl.x, sl.y, sl.r, 0, Math.PI*2);
      ctx.fillStyle = ok ? "rgba(200,16,46,.28)" : "rgba(243,238,230,.08)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = ok ? "#c8102e" : (S.selected && S.selected.slot === need.slot ? "#f3eee6" : "#4a4a4a");
      ctx.stroke();
      ctx.fillStyle = ok ? "#c8102e" : "#8a8480";
      ctx.font = "10px Oswald";
      ctx.textAlign = "center";
      ctx.fillText(ok ? "SET" : sl.label, sl.x, sl.y + 4);
    }
  }

  function update() {
    S.t++;
    if (S.screen !== "play" || !S.car) return;
    S.car.x += (S.car.inX - S.car.x) * 0.08;
    if (!S.tune && S.needed.some(n => !n.done)) {
      S.time -= 0.016;
      if (S.time <= 0) {
        S.time = 0;
        failJob("TOOK TOO LONG");
      }
    }
    const pct = clamp(S.time / S.timeMax, 0, 1);
    document.getElementById("tfill").style.width = (pct * 100) + "%";
    document.getElementById("tfill").style.background = pct < 0.25 ? "#ff1a3c" : "#c8102e";

    if (S.tune) {
      S.tune.pos += S.tune.dir * S.tune.speed;
      if (S.tune.pos > 1) { S.tune.pos = 1; S.tune.dir = -1; }
      if (S.tune.pos < 0) { S.tune.pos = 0; S.tune.dir = 1; }
      needle.style.left = (S.tune.pos * 100) + "%";
    }
    document.getElementById("best").textContent = String(best);
  }

  function draw() {
    drawBay();
    if (S.screen === "menu") {
      lnLogo(W/2, 300, 2.6);
      return;
    }
    if (S.car) {
      drawCar(S.car, S.car.x, 400);
      drawSlots();
    }
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  menuStats.innerHTML = "BEST <b>$" + best + "</b>";
  document.getElementById("best").textContent = String(best);
  loop();
})();
</script>
</body>
</html>
