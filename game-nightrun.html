<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>NIGHT RUN — LN CREW</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#070707; --red:#c4121a; --ink:#f3f1ea; --muted:#9a958a; }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: Barlow, sans-serif; overflow: hidden; }
    .bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 8;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: rgba(7,7,7,.88); border-bottom: 1px solid #2a2a2a;
    }
    .bar a { color: inherit; text-decoration: none; }
    .home-link { color: #9a958a; letter-spacing: .16em; font-size: 11px; text-transform: uppercase; }
    .home-link:hover { color: #fff; }
    .mark img { height: 36px; width: auto; display: block; }
    .overlay-logo { height: 72px; width: auto; margin: 0 auto 16px; display: block; }
    canvas { display: block; width: 100%; height: 100%; background: #070707; }
    #hud {
      position: fixed; left: 14px; right: 14px; top: 52px; z-index: 4;
      display: flex; justify-content: space-between; pointer-events: none;
      font-family: "Bebas Neue", Impact, sans-serif; letter-spacing: .08em; font-size: 22px;
    }
    #hud small { display: block; color: var(--muted); font-family: Barlow, sans-serif; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
    #overlay {
      position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.72); text-align: center; padding: 24px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-family: "Bebas Neue", Impact, sans-serif; font-size: clamp(48px, 14vw, 92px); line-height: .85; letter-spacing: .04em; }
    #overlay h1 em { font-style: normal; color: var(--red); }
    #overlay p { color: var(--muted); margin: 14px auto 22px; max-width: 340px; }
    .btn {
      display: inline-block; border: 1px solid #fff; color: #fff; background: var(--red); border-color: var(--red);
      padding: 12px 22px; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; cursor: pointer;
    }
    .hint { margin-top: 16px; font-size: 12px; color: #6b675f; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="home-link" href="https://lncrew.com/">← Home</a>
    <a class="mark" href="https://lncrew.com/" title="LN Crew home">
      <img src="images/ln-logo.png" alt="LN Crew" onerror="this.src='favicon.png'" />
    </a>
    <a class="home-link" href="#" id="muteBtn" style="text-align:right">Sound on</a>
  </div>
  <div id="hud">
    <div><small>Score</small><span id="score">0</span></div>
    <div style="text-align:right"><small>Best</small><span id="best">0</span></div>
  </div>
  <div id="overlay">
    <div>
      <img class="overlay-logo" src="images/ln-logo.png" alt="LN Crew" onerror="this.src='favicon.png'" />
      <h1>NIGHT<br /><em>RUN</em></h1>
      <p>Dodge traffic. Grab the red LNC tags. Hold for turbo. Don’t bin it.</p>
      <button class="btn" id="startBtn">Pull off</button>
      <p class="hint">Arrow keys / A D · tap sides on phone · space = turbo</p>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");

    const sfx = {
      ctx: null,
      muted: false,
      engine: null,
      lastTurbo: false,
      unlock() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      beep(freq, dur, type, gain) {
        if (this.muted || !this.ctx) return;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type || "square";
        o.frequency.value = freq;
        g.gain.setValueAtTime(gain || 0.08, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + dur);
      },
      noise(dur, gain) {
        if (this.muted || !this.ctx) return;
        const n = this.ctx.createBufferSource();
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        n.buffer = buf;
        const g = this.ctx.createGain();
        const f = this.ctx.createBiquadFilter();
        f.type = "lowpass"; f.frequency.value = 900;
        g.gain.setValueAtTime(gain || 0.12, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        n.connect(f); f.connect(g); g.connect(this.ctx.destination);
        n.start();
      },
      lane() { this.beep(220, 0.07, "square", 0.05); },
      pickup() { this.beep(660, 0.08, "square", 0.07); setTimeout(() => this.beep(880, 0.1, "square", 0.07), 50); },
      turbo() { this.beep(140, 0.18, "sawtooth", 0.06); this.noise(0.16, 0.08); },
      crash() { this.noise(0.35, 0.22); this.beep(90, 0.4, "sawtooth", 0.12); },
      startEngine() {
        if (this.muted || !this.ctx || this.engine) return;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = "sawtooth";
        o.frequency.value = 70;
        g.gain.value = 0.03;
        o.connect(g); g.connect(this.ctx.destination);
        o.start();
        this.engine = { o, g };
      },
      stopEngine() {
        if (!this.engine) return;
        try { this.engine.o.stop(); } catch (e) {}
        this.engine = null;
      }
    };

    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const BEST_KEY = "lncrew_nightrun_best";
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestEl.textContent = String(best);

    const state = {
      running: false,
      over: false,
      t: 0,
      score: 0,
      speed: 7,
      roadOff: 0,
      lane: 1,
      targetLane: 1,
      x: 0,
      turbo: 0,
      cars: [],
      tags: [],
      sparks: [],
      keys: { left: false, right: false, turbo: false },
    };

    const LANES = 3;
    function laneX(i) {
      const roadW = Math.min(420, W * 0.72);
      const left = (W - roadW) / 2;
      return left + roadW * ((i + 0.5) / LANES);
    }
    function roadRect() {
      const roadW = Math.min(420, W * 0.72);
      return { left: (W - roadW) / 2, width: roadW };
    }

    function reset() {
      state.running = true;
      state.over = false;
      state.t = 0;
      state.score = 0;
      state.speed = 7;
      state.roadOff = 0;
      state.lane = 1;
      state.targetLane = 1;
      state.x = laneX(1);
      state.turbo = 0;
      state.cars = [];
      state.tags = [];
      state.sparks = [];
      scoreEl.textContent = "0";
      sfx.lastTurbo = false;
      sfx.startEngine();
    }

    function spawnCar() {
      const lane = Math.floor(Math.random() * LANES);
      const colors = ["#c4121a", "#2a2a2a", "#8a1a1a", "#3d3d3d", "#111"];
      state.cars.push({
        lane, y: -80, w: 42, h: 72,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: state.speed * (0.35 + Math.random() * 0.25),
      });
    }
    function spawnTag() {
      state.tags.push({
        lane: Math.floor(Math.random() * LANES),
        y: -40, r: 16, taken: false,
      });
    }

    function gameOver() {
      if (!state.running) return;
      state.running = false;
      state.over = true;
      sfx.stopEngine();
      sfx.crash();
      if (state.score > best) {
        best = state.score;
        localStorage.setItem(BEST_KEY, String(best));
        bestEl.textContent = String(best);
      }
      overlay.classList.remove("hidden");
      overlay.querySelector("h1").innerHTML = "YOU<br /><em>BINNED IT</em>";
      overlay.querySelector("p").textContent = "Score " + state.score + "  ·  Best " + best;
      startBtn.textContent = "Run it back";
    }

    function drawCar(x, y, w, h, color, player) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#000";
      ctx.fillRect(-w/2 + 4, -h/2 + 8, w - 8, h - 10);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-w/2, -h/2, w, h, 8);
      ctx.fill();
      ctx.fillStyle = player ? "#7ec8ff" : "#223";
      ctx.fillRect(-w/2 + 8, -h/2 + 10, w - 16, 16);
      ctx.fillStyle = "#111";
      ctx.fillRect(-w/2 + 6, h/2 - 16, 10, 12);
      ctx.fillRect(w/2 - 16, h/2 - 16, 10, 12);
      if (player && state.turbo > 0) {
        ctx.fillStyle = "rgba(196,18,26,0.85)";
        ctx.beginPath();
        ctx.moveTo(-8, h/2);
        ctx.lineTo(0, h/2 + 18 + Math.random() * 10);
        ctx.lineTo(8, h/2);
        ctx.fill();
      }
      ctx.restore();
    }

    function loop(now) {
      requestAnimationFrame(loop);
      ctx.clearRect(0, 0, W, H);

      const road = roadRect();
      ctx.fillStyle = "#0b0b0b";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#141414";
      ctx.fillRect(road.left - 18, 0, road.width + 36, H);
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(road.left, 0, road.width, H);

      if (state.running) {
        const boost = state.keys.turbo ? 1.7 : 1;
        if (state.keys.turbo) state.turbo = 12;
        else state.turbo = Math.max(0, state.turbo - 1);
        state.speed += 0.0018;
        const v = state.speed * boost;
        state.roadOff += v;
        state.t++;
        state.score += Math.floor(boost);
        if (state.t % 6 === 0) scoreEl.textContent = String(state.score);

        const prevLane = state.targetLane;
        if (state.keys.left) state.targetLane = Math.max(0, state.targetLane - 1);
        if (state.keys.right) state.targetLane = Math.min(LANES - 1, state.targetLane + 1);
        if (state.targetLane !== prevLane) sfx.lane();
        if (state.keys.turbo && !sfx.lastTurbo) sfx.turbo();
        sfx.lastTurbo = state.keys.turbo;
        if (sfx.engine) {
          sfx.engine.o.frequency.value = 70 + state.speed * 4 + (state.keys.turbo ? 40 : 0);
          sfx.engine.g.gain.value = sfx.muted ? 0 : (state.keys.turbo ? 0.05 : 0.03);
        }
        state.keys.left = false;
        state.keys.right = false;

        const tx = laneX(state.targetLane);
        state.x += (tx - state.x) * 0.22;
        state.lane = state.targetLane;

        if (state.t % Math.max(28, 70 - Math.floor(state.speed * 2)) === 0) spawnCar();
        if (state.t % 90 === 0) spawnTag();
      }

      ctx.save();
      ctx.strokeStyle = "#c4121a";
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 3;
      ctx.setLineDash([18, 22]);
      ctx.lineDashOffset = -state.roadOff;
      const mid1 = road.left + road.width / 3;
      const mid2 = road.left + road.width * 2 / 3;
      ctx.beginPath(); ctx.moveTo(mid1, 0); ctx.lineTo(mid1, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mid2, 0); ctx.lineTo(mid2, H); ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#c4121a";
      ctx.fillRect(road.left - 6, 0, 6, H);
      ctx.fillRect(road.left + road.width, 0, 6, H);

      const py = H * 0.72;
      const pw = 44, ph = 76;

      for (const car of state.cars) {
        if (state.running) car.y += state.speed * 0.55;
        drawCar(laneX(car.lane), car.y, car.w, car.h, car.color, false);
        if (state.running) {
          const dx = Math.abs(state.x - laneX(car.lane));
          const dy = Math.abs(py - car.y);
          if (dx < 34 && dy < 64) gameOver();
        }
      }
      state.cars = state.cars.filter(c => c.y < H + 90);

      for (const tag of state.tags) {
        if (state.running) tag.y += state.speed * 0.7;
        ctx.save();
        ctx.translate(laneX(tag.lane), tag.y);
        ctx.fillStyle = "#c4121a";
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "bold 9px Barlow";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("LNC", 0, 1);
        ctx.restore();
        if (state.running) {
          const dx = Math.abs(state.x - laneX(tag.lane));
          const dy = Math.abs(py - tag.y);
          if (dx < 28 && dy < 36) {
            tag.taken = true;
            state.score += 50;
            scoreEl.textContent = String(state.score);
            sfx.pickup();
          }
        }
      }
      state.tags = state.tags.filter(t => !t.taken && t.y < H + 40);

      drawCar(state.x, py, pw, ph, "#c4121a", true);

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, H - 36, W, 36);
      ctx.fillStyle = "#9a958a";
      ctx.font = "11px Barlow";
      ctx.textAlign = "center";
      ctx.fillText("LN CREW  ·  STREETS N' TRAILS", W / 2, H - 14);
    }
    requestAnimationFrame(loop);

    startBtn.addEventListener("click", () => {
      sfx.unlock();
      overlay.classList.add("hidden");
      reset();
    });

    document.getElementById("muteBtn").addEventListener("click", (e) => {
      e.preventDefault();
      sfx.muted = !sfx.muted;
      e.currentTarget.textContent = sfx.muted ? "Sound off" : "Sound on";
      if (sfx.muted) sfx.stopEngine();
      else if (state.running) { sfx.unlock(); sfx.startEngine(); }
    });

    window.addEventListener("keydown", (e) => {
      sfx.unlock();
      if (e.code === "ArrowLeft" || e.code === "KeyA") { state.keys.left = true; e.preventDefault(); }
      if (e.code === "ArrowRight" || e.code === "KeyD") { state.keys.right = true; e.preventDefault(); }
      if (e.code === "Space" || e.code === "ArrowUp") { state.keys.turbo = true; e.preventDefault(); }
      if ((e.code === "Enter" || e.code === "Space") && !state.running) {
        overlay.classList.add("hidden");
        reset();
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") state.keys.turbo = false;
    });

    let touchX = null;
    canvas.addEventListener("pointerdown", (e) => {
      touchX = e.clientX;
      if (!state.running && !overlay.classList.contains("hidden")) return;
      if (e.clientY < H * 0.35) state.keys.turbo = true;
      else if (e.clientX < W * 0.5) state.keys.left = true;
      else state.keys.right = true;
    });
    canvas.addEventListener("pointerup", () => { state.keys.turbo = false; });
    canvas.addEventListener("pointercancel", () => { state.keys.turbo = false; });
  </script>
</body>
</html>
